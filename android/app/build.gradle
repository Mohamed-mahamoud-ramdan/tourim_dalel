plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services' // Apply the Google services plugin at the bottom
    id 'com.google.firebase.crashlytics' // Apply Crashlytics (if used)
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.example.dalel"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.debug // Update with release config
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.0.0') // Firebase BoM for versioning consistency
    implementation 'com.google.firebase:firebase-analytics-ktx' // Replace with your required Firebase products
    // Example Firebase dependencies:
    // implementation 'com.google.firebase:firebase-auth-ktx'
    // implementation 'com.google.firebase:firebase-firestore-ktx'
}

flutter {
    source = "../.."
}

// Apply the Google services plugin to the bottom of the file
apply plugin: 'com.google.gms.google-services'
